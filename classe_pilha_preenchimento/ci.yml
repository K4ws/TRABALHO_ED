name: testes-preenchimento

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install -r classe_pilha_preenchimento/requirements.txt

      - name: Testar
        run: python -m pytest -v classe_pilha_preenchimento
